[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "langgraph-cae-pipeline-agent"
version = "0.1.0"
description = "LangGraph agent for automating plaque sensitivity analysis simulation pipeline"
requires-python = ">=3.11"

dependencies = [
    # Agent framework
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",

    # LLM
    "anthropic>=0.40",

    # HPC / SSH
    "paramiko>=3.4",
    "fabric>=3.2",

    # CAD (optional — install separately if using Python-OCC)
    # "pythonocc-core>=7.8",

    # Meshing
    "gmsh>=4.12",

    # Simulation post-processing
    "vtk>=9.3",
    "numpy>=1.26",
    "pandas>=2.1",

    # Sensitivity Analysis
    "SALib>=1.5",
    "scikit-learn>=1.4",

    # Dashboard
    "streamlit>=1.35",
    "plotly>=5.20",

    # Utilities
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
